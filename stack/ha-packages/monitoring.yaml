# Home Assistant package: metrics for VictoriaMetrics (docs/08-monitoring.md).
# Install to: /opt/smart-home/homeassistant/config/packages/monitoring.yaml
# Requires in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Enables HA's built-in Prometheus endpoint (/api/prometheus) with an ALLOW-LIST of entities. Only what HA exports
# natively. Nothing is computed or added here; anything else is looked at in HA itself.

prometheus:
  namespace: hass
  filter:
    include_entity_globs:
      - update.*                         # pending updates of HA core and integrations
      - sensor.*battery*                 # device batteries
      - sensor.*humidity*                # climate sensors (entity IDs follow the HA language,
      - sensor.*temperatur*              #   e.g. "..._temperature" or "..._temperatura")
      - humidifier.*                     # dehumidifiers: on/off, target humidity, mode
      - vacuum.*                         # robot vacuums: state
      - sensor.outdoor_*                 # outdoor air quality, UV, dust, sea (ha-packages/outdoor.yaml)
