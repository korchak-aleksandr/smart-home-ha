# Mosquitto MQTT broker (docs/06-home-assistant.md#9-mqtt-broker-mosquitto).
# Deployed to /opt/smart-home/mosquitto/config/. The password file next to it is created on the server, never committed.

# Plain MQTT on the LAN. The container runs on the host network: ufw limits port 1883 to the LAN.
# No TLS: some devices (e.g. Qingping monitors) reject self-signed certificates.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Retained messages and subscriptions survive restarts.
persistence true
persistence_location /mosquitto/data/

# Logs go to `docker logs mosquitto` (Docker rotates them).
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
