apiVersion: 1
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus                  # VictoriaMetrics speaks the Prometheus query API (PromQL + MetricsQL)
    access: proxy
    url: http://127.0.0.1:8428
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s               # = scrape interval
      prometheusType: Prometheus
