apiVersion: 1
providers:
  - name: custom                      # dashboards written for this repo
    folder: Home server
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/custom
  - name: community                   # downloaded from grafana.com by scripts/fetch-grafana-dashboards.sh
    folder: Community
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/community
