# Install to: /etc/netplan/00-installer-config.yaml   (mode 600; then: sudo netplan generate && sudo netplan apply)
# Docs: docs/03-ubuntu-install.md#9-network-optional-interfaces-and-wi-fi-readiness
# Example for a mini PC with two Ethernet ports running on Wi-Fi ("Wi-Fi only" mode).
# Wired mode: remove "optional: true" from the port with the cable, and make Wi-Fi optional in 60-wifi.yaml.
# Wi-Fi itself (60-wifi.yaml) is generated by scripts/setup-wifi.sh because it contains the password.
network:
  version: 2
  ethernets:
    enp2s0:                  # wired; optional while the server runs on Wi-Fi
      optional: true
      dhcp4: true
      dhcp6: true
      accept-ra: true
    enp1s0:                  # second port: unused; optional so boot does not wait for it
      match:
        macaddress: aa:bb:cc:dd:ee:ff   # <- REPLACE (keep what the installer wrote)
      set-name: enp1s0
      dhcp4: true
      optional: true
  # wifis: see 60-wifi.yaml
