# Install to: /etc/systemd/system.conf.d/watchdog.conf   (takes effect after a reboot)
# Docs: docs/04-base-setup.md#5-hardware-watchdog-auto-reboot-on-hangs
# Hardware watchdog: reboot the machine if the system hangs for 30 s; also guard a stuck reboot.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
